name: Build and release

# Runs by itself whenever you commit a change to the app or loader.
# You can also start it by hand from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
    paths:
      - gunmacro.py
      - loader.py
      - build.py
      - Icon.png
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller pillow

      - name: Pick the version number (automatic)
        shell: bash
        run: echo "VERSION=1.1.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: python build.py ${{ env.VERSION }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/GunMacro.exe
            release/manifest.json
            release/Loader.exe
